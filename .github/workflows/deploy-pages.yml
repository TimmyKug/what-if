name: Deploy to Pages

# Reusable so the data refresh can deploy straight after promoting new data:
# a commit pushed with GITHUB_TOKEN does not trigger `push` workflows.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race; queue instead of cancelling, so a data
# refresh that lands mid-deploy still reaches the site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html app.js engine.js styles.css _site/
          cp -R data _site/data
          # Stops Pages running the files through Jekyll.
          touch _site/.nojekyll
          echo "Site contents:" && find _site -type f | sort && du -sh _site

      - name: Check nothing is missing
        run: |
          for f in index.html app.js engine.js styles.css data/market-data.json; do
            test -s "_site/$f" || { echo "missing or empty: $f"; exit 1; }
          done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
